, "inCount": 1, "outCount": 0}, {"name": "UXP$UXUSERLOG_START", "slug": "uxp_uxuserlog_start", "desc": "", "inCount": 2, "outCount": 1}, {"name": "UXP$UX_DELETE", "slug": "uxp_ux_delete", "desc": "", "inCount": 3, "outCount": 3}, {"name": "UXP$UX_LIST_DEPEND", "slug": "uxp_ux_list_depend", "desc": "", "inCount": 0, "outCount": 17}, {"name": "UXP$UX_LIST_DETAIL", "slug": "uxp_ux_list_detail", "desc": "", "inCount": 2, "outCount": 18}, {"name": "UXP$UX_LIST_MAIN", "slug": "uxp_ux_list_main", "desc": "", "inCount": 3, "outCount": 17}, {"name": "UXP$UX_LIST_MENU", "slug": "uxp_ux_list_menu", "desc": "", "inCount": 1, "outCount": 17}, {"name": "UXP$UX_LIST_USERGO", "slug": "uxp_ux_list_usergo", "desc": "", "inCount": 1, "outCount": 14}, {"name": "UXP$WEB_BASE_AUTHORIZE", "slug": "uxp_web_base_authorize", "desc": "", "inCount": 0, "outCount": 2}, {"name": "VBS_GET_KNCLIENT", "slug": "vbs_get_knclient", "desc": "", "inCount": 1, "outCount": 5}, {"name": "VBS_GET_KN_OKSUMMARY", "slug": "vbs_get_kn_oksummary", "desc": "", "inCount": 2, "outCount": 104}, {"name": "VBS_GET_KONTRACT", "slug": "vbs_get_kontract", "desc": "", "inCount": 1, "outCount": 10}, {"name": "VBS_IS_KN_MODE", "slug": "vbs_is_kn_mode", "desc": "", "inCount": 1, "outCount": 1}, {"name": "WIREBANK_OPERBOOK_CREATE", "slug": "wirebank_operbook_create", "desc": "", "inCount": 1, "outCount": 0}, {"name": "WORKING_STAFF_EMAIL", "slug": "working_staff_email", "desc": "", "inCount": 1, "outCount": 2}, {"name": "WORKPLACE_LIST", "slug": "workplace_list", "desc": "", "inCount": 4, "outCount": 3}, {"name": "WRITEOFF_IGNORE_INSERT", "slug": "writeoff_ignore_insert", "desc": "", "inCount": 4, "outCount": 1}, {"name": "XML_TAG_GET_VALUE", "slug": "xml_tag_get_value", "desc": "", "inCount": 2, "outCount": 1}, {"name": "ZALOG_COUNT", "slug": "zalog_count", "desc": "", "inCount": 1, "outCount": 1}];
  const CATS = ["UXP$", "AAREP", "BLANK", "CARD", "CB24", "CB_", "CC_", "CES_", "CEO_", "CHECK_", "CM_", "CIB_", "CRM_", "ELCARD_", "EPASS_", "FIND_", "FM_", "FSROBOT_", "GET_", "HP_", "FT_", "HR_", "INN_", "INSERT_", "IPC_", "IPF_", "ISHENIM_", "KIB_", "KIBSEND_", "KONTRACT_", "MC_", "MILLICARD_", "MKR_", "MONETA_", "OKT_", "PKB_", "PRINT_", "EQUIFAX_", "CRIF_", "RCIB_", "SVC_", "ANTIFRAUD_", "EDOC_", "LLC_", "OKTELL_", "PAYSYS_", "AGREEMENT_", "CLIENTSTATUS_", "CNP_"];

  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const sortBtns = Array.from(document.querySelectorAll('.sort-btn'));
  const toolbarEl = document.getElementById('toolbar');
  const listWrapEl = document.getElementById('listWrap');
  const catsEl = document.getElementById('cats');
  const viewTabs = Array.from(document.querySelectorAll('.view-tab'));

  let sortKey = 'name';
  let sortDir = 1;

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function highlight(text, q){
    if(!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if(i === -1) return esc(text);
    return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
  }

  function updateSortIcons(){
    for(const btn of sortBtns){
      const icon = btn.querySelector('.sort-icon');
      if(btn.dataset.key === sortKey){
        btn.classList.add('active');
        icon.textContent = sortDir === 1 ? '↑' : '↓';
      } else {
        btn.classList.remove('active');
        icon.textContent = '';
      }
    }
  }

  function render(query){
    const q = query.trim().toLowerCase();
    let rows = !q ? DATA.slice() : DATA.filter(r => r.name.toLowerCase().includes(q) || (r.desc && r.desc.toLowerCase().includes(q)));
    countEl.textContent = q ? (rows.length + ' из ' + DATA.length) : (DATA.length + ' процедур, по алфавиту');

    rows.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if(sortKey === 'params'){
        return ((a.inCount + a.outCount) - (b.inCount + b.outCount)) * sortDir;
      }
      av = (av || '').toLowerCase(); bv = (bv || '').toLowerCase();
      if(av < bv) return -1 * sortDir;
      if(av > bv) return 1 * sortDir;
      return 0;
    });

    const parts = [];
    for(const r of rows){
      const descHtml = r.desc ? highlight(r.desc, q) : '—';
      parts.push(
        '<a class="idx-row" href="procedures/' + r.slug + '.html">' +
          '<span class="name">' + highlight(r.name, q) + '</span>' +
          '<span class="d' + (r.desc ? '' : ' empty') + '">' + descHtml + '</span>' +
          '<span class="n">' + (r.inCount + r.outCount) + '</span>' +
        '</a>'
      );
    }
    listEl.innerHTML = parts.join('');
  }

  let t;
  searchEl.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => render(searchEl.value), 80); });
  for(const btn of sortBtns){
    btn.addEventListener('click', () => {
      if(sortKey === btn.dataset.key){
        sortDir *= -1;
      } else {
        sortKey = btn.dataset.key;
        sortDir = 1;
      }
      updateSortIcons();
      render(searchEl.value);
    });
  }
  updateSortIcons();
  render('');

  // ---------------------------------------------------------- categories ----
  let catsBuilt = false;
  let catBuckets = [];
  const catSort = {};

  function catRowsHtml(items){
    return items.map(r =>
      '<a class="idx-row" href="procedures/' + r.slug + '.html">' +
        '<span class="name">' + esc(r.name) + '</span>' +
        '<span class="d' + (r.desc ? '' : ' empty') + '">' + (r.desc ? esc(r.desc) : '—') + '</span>' +
        '<span class="n">' + (r.inCount + r.outCount) + '</span>' +
      '</a>'
    ).join('');
  }

  function sortCatItems(items, key, dir){
    const arr = items.slice();
    arr.sort((a, b) => {
      if(key === 'params'){
        return ((a.inCount + a.outCount) - (b.inCount + b.outCount)) * dir;
      }
      const av = (a[key] || '').toLowerCase(), bv = (b[key] || '').toLowerCase();
      if(av < bv) return -1 * dir;
      if(av > bv) return 1 * dir;
      return 0;
    });
    return arr;
  }

  function renderCatBody(ci){
    const st = catSort[ci];
    const sorted = sortCatItems(catBuckets[ci].items, st.key, st.dir);
    catsEl.querySelector('#cat-list-' + ci).innerHTML = catRowsHtml(sorted);
    const head = catsEl.querySelector('#cat-head-' + ci);
    head.querySelectorAll('.sort-btn').forEach(btn => {
      const icon = btn.querySelector('.sort-icon');
      if(btn.dataset.key === st.key){
        btn.classList.add('active');
        icon.textContent = st.dir === 1 ? '↑' : '↓';
      } else {
        btn.classList.remove('active');
        icon.textContent = '';
      }
    });
  }

  function buildCategories(){
    if(catsBuilt) return;
    catsBuilt = true;
    const buckets = CATS.map(prefix => ({ prefix, items: [] }));
    const other = [];
    for(const r of DATA){
      const nameUpper = r.name.toUpperCase();
      const bucket = buckets.find(b => nameUpper.startsWith(b.prefix));
      if(bucket) bucket.items.push(r); else other.push(r);
    }
    buckets.push({ prefix: 'Другие', items: other });
    catBuckets = buckets.filter(b => b.items.length);

    const parts = [];
    catBuckets.forEach((b, ci) => {
      catSort[ci] = { key: 'name', dir: 1 };
      parts.push(
        '<details class="param-details">' +
          '<summary class="param-head">' + esc(b.prefix) + '<span class="legend">' + b.items.length + ' шт.</span></summary>' +
          '<div class="idx-wrap">' +
            '<div class="idx-table-head" id="cat-head-' + ci + '">' +
              '<button type="button" class="sort-btn" data-ci="' + ci + '" data-key="name">Название<span class="sort-icon"></span></button>' +
              '<button type="button" class="sort-btn" data-ci="' + ci + '" data-key="desc">Описание<span class="sort-icon"></span></button>' +
              '<button type="button" class="sort-btn" data-ci="' + ci + '" data-key="params">Входных параметров<span class="sort-icon"></span></button>' +
            '</div>' +
            '<div class="idx-list" id="cat-list-' + ci + '"></div>' +
          '</div>' +
        '</details>'
      );
    });
    catsEl.innerHTML = parts.join('');
    catBuckets.forEach((b, ci) => renderCatBody(ci));

    catsEl.addEventListener('click', e => {
      const btn = e.target.closest('.sort-btn');
      if(!btn) return;
      const ci = Number(btn.dataset.ci);
      const st = catSort[ci];
      if(st.key === btn.dataset.key){ st.dir *= -1; } else { st.key = btn.dataset.key; st.dir = 1; }
      renderCatBody(ci);
    });
  }

  for(const tab of viewTabs){
    tab.addEventListener('click', () => {
      if(tab.classList.contains('active')) return;
      for(const t2 of viewTabs) t2.classList.remove('active');
      tab.classList.add('active');
      const isCats = tab.dataset.view === 'cats';
      toolbarEl.hidden = isCats;
      listWrapEl.hidden = isCats;
      catsEl.hidden = !isCats;
      if(isCats) buildCategories();
    });
  }
</script>
