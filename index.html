  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const sortBtns = Array.from(document.querySelectorAll('.sort-btn'));
  const uxToggle = document.getElementById('show-ux');
  const isolatedToggle = document.getElementById('show-isolated');

  let sortKey = 'name';
  let sortDir = 1; // 1 = asc, -1 = desc

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function highlight(text, q){
    if(!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if(i === -1) return esc(text);
    return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
  }

  function updateSortIcons(){
    for(const btn of sortBtns){
      const icon = btn.querySelector('.sort-icon');
      if(btn.dataset.key === sortKey){
        btn.classList.add('active');
        icon.textContent = sortDir === 1 ? '↑' : '↓';
      } else {
        btn.classList.remove('active');
        icon.textContent = '';
      }
    }
  }

  function render(query){
    const q = query.trim().toLowerCase();
    const showUx = uxToggle.checked;
    const showIsolated = isolatedToggle.checked;
    let rows = q ? DATA.filter(r => r.name.toLowerCase().includes(q)) : DATA.slice();
    if(!showUx) rows = rows.filter(r => !r.ux);
    if(!showIsolated) rows = rows.filter(r => r.connections > 0);
    countEl.textContent = (q || !showUx || !showIsolated) ? (rows.length + ' из ' + DATA.length) : (DATA.length + ' таблиц');

    rows.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if(sortKey === 'connections'){
        return (av - bv) * sortDir;
      }
      av = (av || '').toLowerCase(); bv = (bv || '').toLowerCase();
      if(av < bv) return -1 * sortDir;
      if(av > bv) return 1 * sortDir;
      return 0;
    });

    const parts = [];
    for(const r of rows){
      const descHtml = r.desc ? highlight(r.desc, q) : '—';
      parts.push(
        '<a class="idx-row" href="tables/' + r.slug + '.html">' +
          '<span class="name">' + highlight(r.name, q) + '</span>' +
          '<span class="d' + (r.desc ? '' : ' empty') + '">' + descHtml + '</span>' +
          '<span class="n">' + r.connections + '</span>' +
        '</a>'
      );
    }
    listEl.innerHTML = parts.join('');
  }

  let t;
  searchEl.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => render(searchEl.value), 80); });
  uxToggle.addEventListener('change', () => render(searchEl.value));
  isolatedToggle.addEventListener('change', () => render(searchEl.value));
  for(const btn of sortBtns){
    btn.addEventListener('click', () => {
      if(sortKey === btn.dataset.key){
        sortDir *= -1;
      } else {
        sortKey = btn.dataset.key;
        sortDir = 1;
      }
      updateSortIcons();
      render(searchEl.value);
    });
  }
  updateSortIcons();
  render('');
</script>
